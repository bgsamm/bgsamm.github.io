<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
    <!--<title> - My Webpage</title>-->
    <link rel="stylesheet" href="/styles/base.css" />

    <link rel="stylesheet" href="/styles/index.css" />
    <script src="/scripts/index.js"></script>
</head>

<body>
    <div class="channel-viewport">
        <div class="channel-arrow left" onclick="prevChannelPage()"></div>
        <div class="channel-arrow right" onclick="nextChannelPage()"></div>
        <div class="channel-ribbon">
            <div class="channel-grid">
                    <div class="channel">
                        <div class="channel-title">Movie Channel</div>
                        <div class="channel-date">2026-04-11</div>
                        <a class="channel-link" href="/movies/dex/"></a>
                    </div>
                    <div class="channel">
                        <div class="channel-title">Music Channel</div>
                        <div class="channel-date">2026-04-11</div>
                        <a class="channel-link" href="/music/dex/"></a>
                    </div>
                    <div class="channel">
                        <div class="channel-title">Video Game Channel</div>
                        <div class="channel-date">2026-04-14</div>
                        <a class="channel-link" href="/video_games/dex/"></a>
                    </div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
                    <div class="channel empty"></div>
            </div>
        </div>
    </div>

    <div id="menu-bar">
        <h1>Home Menu</h1>
        <div id="menu-bar-center-border">
            <div id="menu-bar-center"></div>
        </div>
        <div id="menu-bar-left-border" class="menu-bar-wing-border">
            <div id="menu-bar-left" class="menu-bar-wing">
                <div class="menu-bar-button">
                    <div class="menu-bar-button-icon">⚙️</div>
                </div>
            </div>
        </div>
        <div id="menu-bar-right-border" class="menu-bar-wing-border">
            <div id="menu-bar-right" class="menu-bar-wing">
                <div class="menu-bar-button">
                    <div class="menu-bar-button-icon">🔎</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
